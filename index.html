<!DOCTYPE html>
<html lang="es" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Horario · 2º GM</title>
<meta name="description" content="Horario de 2º GM (SMR) del I.E.S. Alfonso XI: qué toca ahora, cuánto queda, tareas, exámenes y notas.">
<meta name="theme-color" content="#04050b">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horario">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap">

<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/fx.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>

<body>

<!-- ======================= FONDO ======================= -->
<div class="bg" aria-hidden="true"></div>
<canvas class="bg-canvas" aria-hidden="true"></canvas>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>
<div class="orb orb-3" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="scanlines hidden" aria-hidden="true"></div>
<div class="cursor-glow" aria-hidden="true"></div>

<!-- ======================= ARRANQUE ======================= -->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="color:var(--accent)">
        <rect x="3" y="4.5" width="18" height="16" rx="3"/>
        <path d="M8 2.5v4M16 2.5v4M3 9.5h18M7.5 13h4M7.5 16.5h7"/>
      </svg>
    </div>
    <div>
      <div class="display" style="font-size:20px">Horario 2º GM</div>
      <div class="boot-text" style="margin-top:8px">I.E.S. Alfonso XI · Alcalá la Real</div>
    </div>
    <div class="boot-bar"><i></i></div>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="app">

  <!-- Carril lateral (PC) -->
  <aside class="rail glass">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:var(--accent)">
          <rect x="3" y="4.5" width="18" height="16" rx="3"/>
          <path d="M8 2.5v4M16 2.5v4M3 9.5h18M7.5 13h4M7.5 16.5h7"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">Horario</div>
        <div class="brand-sub">2º GM · SMR</div>
      </div>
    </div>

    <nav class="nav" aria-label="Secciones"></nav>

    <div class="rail-foot">
      <div class="mini-card">
        <div class="eyebrow" style="margin-bottom:6px">Atajos</div>
        <div class="row between" style="font-size:11.5px;color:var(--ink-3)">
          <span>Buscar</span><span class="mono">K</span>
        </div>
        <div class="row between" style="font-size:11.5px;color:var(--ink-3)">
          <span>Foco</span><span class="mono">F</span>
        </div>
        <div class="row between" style="font-size:11.5px;color:var(--ink-3)">
          <span>Hoy</span><span class="mono">T</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Columna principal -->
  <div class="main">
    <header class="topbar glass">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span class="status-text">
          <span class="status-main" id="status-main">Cargando…</span>
          <span class="status-sub" id="status-sub" style="display:block"></span>
        </span>
      </div>

      <div class="topbar-clock">
        <div class="t mono" id="clock-time">--:--</div>
        <div class="d" id="clock-date"></div>
      </div>

      <button class="icon-btn" id="btn-today" type="button" title="Ir a hoy (T)" aria-label="Ir a hoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-search" type="button" title="Buscar (K)" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20.2 20.2-3.7-3.7"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-focus" type="button" title="Modo foco (F)" aria-label="Modo foco">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 9.2V4h5.2M20 14.8V20h-5.2M14.8 4H20v5.2M9.2 20H4v-5.2"/>
        </svg>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <!-- Barra inferior (Android) -->
  <nav class="tabbar glass" aria-label="Navegación"></nav>

  <button class="fab" type="button" aria-label="Añadir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
</div>

<div class="toasts"></div>

<!-- ======================= SCRIPTS ======================= -->
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/fx.js"></script>
<script src="js/time.js"></script>
<script src="js/notify.js"></script>
<script src="js/focus.js"></script>
<script src="js/palette.js"></script>
<script src="js/views-schedule.js"></script>
<script src="js/views-study.js"></script>
<script src="js/app.js"></script>
</body>
</html>
